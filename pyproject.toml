[project]
name = "marktplaats-scheduler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.1",
    "marktplaats>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "python-ntfy>=0.11.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"

[tool.uv.sources]
marktplaats = { git = "https://github.com/jensjeflensje/marktplaats-py.git" }
